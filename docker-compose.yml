services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: yoguide-postgres
    network_mode: host
    environment:
      POSTGRES_USER: yoguide
      POSTGRES_PASSWORD: yoguide
      POSTGRES_DB: yoguide
    volumes:
      - yoguide-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yoguide"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    container_name: yoguide-app
    network_mode: host
    environment:
      - NODE_ENV=production
      - PORT=3031  # Changed from 3030 to 3031
      - DATABASE_URL=postgresql://yoguide:yoguide@localhost:5432/yoguide?schema=public
      - DIRECT_URL=postgresql://yoguide:yoguide@localhost:5432/yoguide?schema=public
      - JWT_SECRET=change-me-to-a-long-random-string
      - JWT_EXPIRES_IN=30d
      - GOOGLE_CLIENT_ID=24803296444-vc5gsest1rgrbnljpn8g9qaai9cr9o5c.apps.googleusercontent.com
      - FRONTEND_URL=yoguide://reset-password
      - GMAIL_USER=yoGuideafrica@gmail.com
      - GMAIL_APP_PASSWORD=umbwirenyiguhe
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  yoguide-pg:
