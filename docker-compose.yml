services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: yoguide-postgres
    network_mode: host
    environment:
      POSTGRES_USER: yoguide
      POSTGRES_PASSWORD: yoguide
      POSTGRES_DB: yoguide
    volumes:
      - yoguide-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yoguide"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    container_name: yoguide-app
    ports:
      - "3031:3031"
    # Secrets are read from the environment / an untracked .env file — never
    # written here. This file is committed to git, and it previously carried
    # a real Gmail app password and JWT secret in plaintext.
    # Copy .env.example to .env and fill it in; compose picks it up automatically.
    environment:
      - NODE_ENV=production
      - PORT=3031
      - DATABASE_URL=${DATABASE_URL:?set DATABASE_URL in .env}
      - DIRECT_URL=${DIRECT_URL:?set DIRECT_URL in .env}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - FRONTEND_URL=${FRONTEND_URL:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - GMAIL_USER=${GMAIL_USER:-}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-}
      - YOECOPAY_WORKER_BASE=${YOECOPAY_WORKER_BASE:-}
      - YOECOPAY_APP_SECRET=${YOECOPAY_APP_SECRET:-}
      - YOECOPAY_WEBHOOK_SECRET=${YOECOPAY_WEBHOOK_SECRET:-}
      - USD_TO_RWF_RATE=${USD_TO_RWF_RATE:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  yoguide-pg:
