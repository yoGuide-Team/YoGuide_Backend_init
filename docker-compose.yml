services:
  # Self-hosted Postgres. Skip/remove this service entirely if you're
  # pointing DATABASE_URL/DIRECT_URL at the shared Supabase database
  # instead — see .env.example and README-DEPLOYMENT.md.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: yoguide-postgres
    environment:
      POSTGRES_USER: yoguide
      POSTGRES_PASSWORD: yoguide
      POSTGRES_DB: yoguide
    volumes:
      - yoguide-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yoguide"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - yoguide-net

  app:
    build: .
    restart: unless-stopped
    container_name: yoguide-app
    # Loads every var from .env in this same folder (copy .env.example ->
    # .env and fill it in first). Anything listed under `environment:`
    # below overrides the .env file's value.
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3030}
    ports:
      - "${PORT:-3030}:${PORT:-3030}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - yoguide-net

networks:
  yoguide-net:

volumes:
  yoguide-pg:
